services:
  reverse-proxy:
    image: traefik:v3.4
    container_name: "traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy      
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls=true"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=amercadero@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"        
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      # So that Traefik can listen to the Docker events
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  munibot-api:
    build:
      context: .
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /home/adria/munibot/config/munibot.sqlite:/opt/munibot/munibot.sqlite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.munibotapi.rule=Host(`api.munibot.amercader.net`)"
      - "traefik.http.routers.munibotapi.entrypoints=websecure"
      - "traefik.http.routers.munibotapi.tls.certresolver=le"      

networks:
  proxy:
    name: proxy
